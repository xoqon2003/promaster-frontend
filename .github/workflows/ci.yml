name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      # Playwright browsers must be present BEFORE unit tests because
      # the storybook-vitest project runs stories in a real chromium
      # via @vitest/browser-playwright. Without binaries the storybook
      # test project fails immediately.
      - name: Install Playwright browsers
        run: pnpm --filter @ustatop/web exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: E2E tests
        run: pnpm --filter @ustatop/web exec playwright test
